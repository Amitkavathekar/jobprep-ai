<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Badge -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#cyanPurple)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Main AI Briefcase Symbol -->
  <g filter="url(#neonGlow)">
    <!-- Handle -->
    <path d="M 200 130 C 200 90, 312 90, 312 130 L 312 150 L 200 150 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="22" stroke-linejoin="round"/>
    
    <!-- Briefcase Body / Document Page Fold -->
    <rect x="70" y="150" width="372" height="280" rx="40" fill="none" stroke="url(#cyanPurple)" stroke-width="24"/>
    <path d="M 382 150 L 442 210 L 382 210 Z" fill="url(#cyanPurple)"/>

    <!-- Neural Network Brain Nodes -->
    <circle cx="170" cy="240" r="18" fill="#00f2fe"/>
    <circle cx="256" cy="205" r="22" fill="#38ef7d"/>
    <circle cx="342" cy="240" r="18" fill="#00f2fe"/>
    
    <circle cx="145" cy="320" r="20" fill="#9d4edd"/>
    <circle cx="256" cy="290" r="26" fill="#00f2fe"/>
    <circle cx="367" cy="320" r="20" fill="#9d4edd"/>
    
    <circle cx="195" cy="375" r="18" fill="#00f2fe"/>
    <circle cx="317" cy="375" r="18" fill="#38ef7d"/>

    <!-- Neural Connections -->
    <path d="M 170 240 L 256 205 L 342 240 M 170 240 L 145 320 M 256 205 L 256 290 M 342 240 L 367 320 M 145 320 L 256 290 L 367 320 M 145 320 L 195 375 M 256 290 L 195 375 M 256 290 L 317 375 M 367 320 L 317 375 M 195 375 L 317 375" fill="none" stroke="url(#cyanPurple)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
